services:
  app:
    environment:
      SCHOLARSCOPE_PG_HOST: postgres
      SCHOLARSCOPE_PG_USER: research
      SCHOLARSCOPE_PG_DATABASE: research
      SCHOLARSCOPE_PG_PASSWORD: ${SCHOLARSCOPE_PG_PASSWORD:?Set SCHOLARSCOPE_PG_PASSWORD in a private env file}
      SCHOLARSCOPE_S3_BUCKET: research
      SCHOLARSCOPE_S3_ENDPOINT: http://objects:8333
      AWS_ACCESS_KEY_ID: ${SCHOLARSCOPE_S3_ACCESS_KEY:?Set SCHOLARSCOPE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SCHOLARSCOPE_S3_SECRET_KEY:?Set SCHOLARSCOPE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      NO_PROXY: postgres,objects,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      objects:
        condition: service_started
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_DB: research
      POSTGRES_PASSWORD: ${SCHOLARSCOPE_PG_PASSWORD:?Set SCHOLARSCOPE_PG_PASSWORD}
    volumes:
      - research-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 15
  objects:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-ip=objects", "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=2", "-master.telemetry=false"]
    volumes:
      - research-objects:/data
    configs:
      - source: s3-auth
        target: /etc/seaweedfs/s3.json
configs:
  s3-auth:
    content: |
      {"identities":[{"name":"research","credentials":[{"accessKey":"${SCHOLARSCOPE_S3_ACCESS_KEY:?Set SCHOLARSCOPE_S3_ACCESS_KEY}","secretKey":"${SCHOLARSCOPE_S3_SECRET_KEY:?Set SCHOLARSCOPE_S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
volumes:
  research-postgres:
  research-objects:
